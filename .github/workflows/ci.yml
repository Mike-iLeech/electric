name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-desktop:
    name: macOS ${{ matrix.arch }} DMG and ZIP
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Native Electron persistence and exports
        run: node scripts/desktop-smoke.cjs
      - name: Build native macOS app and disk image
        run: pnpm exec electron-builder --config electron-builder.cjs --mac --${{ matrix.arch }} --publish never
      - name: Verify app architecture, signature and icons
        run: node scripts/mac-verify.cjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ElectricCAD-Easy-macOS-${{ matrix.arch }}
          path: |
            release/*-mac-${{ matrix.arch }}.dmg
            release/*-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build standalone application
        run: pnpm build

  windows-desktop:
    name: Windows EXE and installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build standalone application
        run: pnpm build
      - name: Test desktop persistence and exports
        run: node scripts/desktop-smoke.cjs
      - name: Build Windows installer
        run: pnpm desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: ElectricCAD-Easy-Windows-x64-preview
          path: |
            release/*-Setup-x64.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
